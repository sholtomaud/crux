<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/tokens.css">
  <script src="/theme.js"></script>
  <title>crux — DB Explorer</title>
  <style>
    h1 { font-size: 1.4rem; color: var(--color-text-bright); margin-bottom: 1.5rem; }
    .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .tab { padding: 0.4rem 0.9rem; border-radius: var(--radius-sm); border: 1px solid var(--color-border-strong);
           font-size: 0.8rem; cursor: pointer; background: var(--color-surface-container); color: var(--color-text-subtle); }
    .tab.active { background: var(--color-surface-container-highest); color: var(--color-text-bright); border-color: var(--color-text-dimmer); }
    #table-wrap { overflow-x: auto; }
    td { white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    th { white-space: nowrap; }
    .count { font-size: 0.78rem; color: var(--color-text-dimmer); margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div id="app-main">
    <h1>DB Explorer</h1>
    <div class="tabs" id="tabs"></div>
    <div class="count" id="count"></div>
    <div id="table-wrap"><p class="loading">Select a table above.</p></div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    const TABLES = ['projects','tasks','dependencies','sessions','roi_records','test_runs','audit','adrs','task_adrs'];
    let active = null;

    const tabsEl  = document.getElementById('tabs');
    const countEl = document.getElementById('count');
    const wrap    = document.getElementById('table-wrap');

    for (const t of TABLES) {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = t;
      btn.onclick = () => loadTable(t);
      tabsEl.appendChild(btn);
    }

    async function loadTable(name) {
      active = name;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.textContent === name));
      wrap.innerHTML = '<p class="loading">Loading…</p>';
      let rows;
      try { rows = await fetchJson(`/api/db/${name}`); }
      catch (e) { wrap.innerHTML = `<p class="error">Error: ${e.message}</p>`; return; }

      if (rows.length === 0) { wrap.innerHTML = '<p class="loading">(empty)</p>'; countEl.textContent = '0 rows'; return; }
      countEl.textContent = `${rows.length} rows`;

      const cols = Object.keys(rows[0]);
      wrap.innerHTML = `
        <table>
          <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.map(r => `<tr>${cols.map(c => `<td title="${String(r[c] ?? '')}">${r[c] ?? ''}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>`;
    }

    (async () => { renderAgentPanel(); await renderSidebar('db'); loadTable('projects'); })();
  </script>
</body>
</html>
