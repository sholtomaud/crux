<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="/manifest.json">
  <title>crux — ROI Dashboard</title>
  <style>
    h1 { font-size: 1.4rem; color: var(--color-text-bright); margin-bottom: 1.5rem; }
    .warn { color: var(--color-warning); }
    .ok   { color: var(--color-primary); }
    .na   { color: var(--color-text-dimmer); }
    .signal-box { margin-top: 2rem; padding: 1rem; background: var(--color-surface-container); border-radius: var(--radius); border-left: 3px solid var(--color-warning); }
    .signal-box h2 { font-size: 0.85rem; color: var(--color-warning); margin-bottom: 0.5rem; margin-top: 0; }
    .signal-box p { font-size: 0.82rem; color: #ccc; line-height: 1.7; }
  </style>
</head>
<body>
  <div id="app-main">
    <h1>ROI Dashboard</h1>
    <div id="content"><p class="loading">Loading…</p></div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    const BASELINE = 150; // AUD/hr — update to match config

    async function render() {
      renderAgentPanel();
      await renderSidebar('roi');
      const content = document.getElementById('content');
      let data;
      try { data = await fetchJson('/api/roi'); }
      catch (e) { content.innerHTML = `<p class="error">Error: ${e.message}</p>`; return; }

      const warnings = [];
      const active = data.filter(p => p.status === 'active');
      if (active.length > 2) warnings.push(`⚠ SPREAD: ${active.length} active projects`);

      const rows = data.map(p => {
        const roiLabel = p.roi_per_hour !== null ? `$${p.roi_per_hour.toFixed(0)}/hr` : null;
        const roiClass = roiLabel === null ? 'na' : p.roi_per_hour < BASELINE && p.hours > 20 ? 'warn' : 'ok';
        if (roiClass === 'warn') warnings.push(`⚠ ${p.name}: ROI ${roiLabel} vs $${BASELINE}/hr opportunity cost`);
        return `<tr>
          <td>${p.name}</td>
          <td>${p.type}</td>
          <td>${p.status}</td>
          <td>${p.hours.toFixed(1)}h</td>
          <td>$${p.roi.revenue.toFixed(0)}</td>
          <td>$${p.roi.cost.toFixed(0)}</td>
          <td class="${roiClass}">${roiLabel ?? '—'}</td>
        </tr>`;
      }).join('');

      content.innerHTML = `
        <table>
          <thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Hours</th><th>Revenue</th><th>Cost</th><th>ROI/hr</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${warnings.length > 0 ? `<div class="signal-box"><h2>Signals</h2>${warnings.map(w => `<p>${w}</p>`).join('')}</div>` : ''}
      `;
    }
    render();
  </script>
</body>
</html>
