<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/tokens.css">
  <script src="/theme.js"></script>
  <title>crux — Portfolio</title>
  <style>
    .page-header { margin-bottom: var(--space-section-gap); }
    .page-title { font-size: 1.3rem; font-weight: 700; color: var(--color-text-bright); }
    .page-sub { font-size: 0.8rem; color: var(--color-text-dim); margin-top: 0.2rem; }

    .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: var(--space-section-gap); }
    .metric-card { display: flex; flex-direction: column; gap: 0.5rem; }
    .metric-card.warn { border-color: var(--color-warn-border); background: var(--color-warn-surface); }
    .metric-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-dim); display: flex; align-items: center; justify-content: space-between; }
    .metric-value { font-size: 1.5rem; font-weight: 700; color: var(--color-text-bright); }
    .metric-value.danger { color: var(--color-danger); }
    .metric-note { font-size: 0.75rem; color: var(--color-text-dim); }

    .section-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
                      color: var(--color-text-dim); margin-bottom: 0.9rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--color-border); }
    .initiatives { display: flex; flex-direction: column; gap: 0.75rem; }
    .initiative-card { display: block; color: inherit; }
    .initiative-card:hover { text-decoration: none; border-color: var(--color-border-strong); }
    .initiative-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; gap: 0.75rem; }
    .initiative-name { font-size: 1rem; font-weight: 700; color: var(--color-text-bright); }
    .initiative-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 1.25rem; align-items: center; }
    .initiative-progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--color-text-dim); margin-bottom: 0.3rem; }
    .initiative-next-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-dimmer); margin-bottom: 0.2rem; }
    .initiative-next-value { font-size: 0.82rem; color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .initiative-executor { display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <div id="app-main">
    <div class="page-header">
      <div class="page-title">Portfolio</div>
      <div class="page-sub">find your critical path across every active project</div>
    </div>
    <div id="metrics" class="metrics-row"></div>
    <div class="section-label">Active Initiatives</div>
    <div id="initiatives" class="initiatives"><p class="loading">Loading…</p></div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

    async function render() {
      const metricsEl     = document.getElementById('metrics');
      const initiativesEl = document.getElementById('initiatives');

      renderAgentPanel();
      const projects = await renderSidebar('portfolio');
      if (!projects) {
        initiativesEl.innerHTML = '<p class="error">Failed to load projects.</p>';
        return;
      }

      const active = projects.filter(p => p.status === 'active');
      const totalHours   = active.reduce((s, p) => s + p.hours, 0);
      const totalRevenue = active.reduce((s, p) => s + p.roi.revenue, 0);
      const totalDone    = active.reduce((s, p) => s + p.done_count, 0);
      const roiPerHour   = totalHours > 0 ? totalRevenue / totalHours : null;
      const BASELINE     = 150; // AUD/hr opportunity cost — matches roi.html

      const metrics = [
        {
          label: 'Spread', warn: active.length > 2,
          value: `${active.length} Active`,
          note: active.length > 2
            ? 'Exceeds optimal concurrency (2). Risk of context-switching overhead.'
            : 'Within optimal concurrency.',
        },
        {
          label: 'Opportunity Cost',
          value: roiPerHour !== null ? `$${roiPerHour.toFixed(0)}/hr` : '—',
          danger: roiPerHour !== null && roiPerHour < BASELINE,
          note: `vs $${BASELINE}/hr baseline`,
        },
        {
          label: 'Tasks Done',
          value: `${totalDone}`,
          note: 'across active projects (all-time)',
        },
      ];

      metricsEl.innerHTML = metrics.map(m => `
        <div class="card metric-card ${m.warn ? 'warn' : ''}">
          <div class="metric-label">${m.label} ${m.warn ? icon('warning', 14) : ''}</div>
          <div class="metric-value ${m.danger ? 'danger' : ''}">${m.value}</div>
          <div class="metric-note">${m.note}</div>
        </div>
      `).join('');

      if (!active.length) {
        initiativesEl.innerHTML = '<p class="loading">No active projects.</p>';
        return;
      }

      initiativesEl.innerHTML = active.map(p => {
        const pct = p.task_count > 0 ? Math.round((p.done_count / p.task_count) * 100) : 0;
        const next = p.next_task;
        return `
          <a href="/project?id=${p.id}" class="card initiative-card">
            <div class="initiative-top">
              <span class="initiative-name">${p.name}</span>
              ${statusBadge(p.status)}
            </div>
            <div class="initiative-grid">
              <div>
                <div class="initiative-progress-label"><span>Completion</span><span>${pct}%</span></div>
                <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
              </div>
              <div>
                <div class="initiative-next-label">Next Action</div>
                <div class="initiative-next-value">${next ? next.title : 'No open tasks'}</div>
              </div>
              <div class="initiative-executor">${next ? executorBadge(next.executor) : ''}</div>
            </div>
          </a>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
