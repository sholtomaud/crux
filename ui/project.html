<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/tokens.css">
  <script src="/theme.js"></script>
  <title>crux — Project</title>
  <style>
    .breadcrumb { font-size: 0.75rem; color: var(--color-text-dimmer); margin-bottom: 0.3rem; }
    .breadcrumb a { color: var(--color-text-dimmer); }
    .page-header-row { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;
                        margin-bottom: var(--space-section-gap); padding-bottom: 1rem; border-bottom: 1px solid var(--color-border); }
    .project-title-row { display: flex; align-items: center; gap: 0.75rem; }
    h1 { font-size: 1.4rem; color: var(--color-text-bright); }
    .meta { font-size: 0.82rem; color: var(--color-text-dim); }

    .session-widget { display: flex; align-items: center; gap: 0.7rem; }
    .session-btn { font: inherit; font-size: 0.78rem; border-radius: var(--radius-sm); padding: 0.4em 0.9em; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4em; }
    .session-btn.start { background: var(--color-success-surface); color: var(--color-primary); border: 1px solid var(--color-success-border); }
    .session-btn.stop  { background: var(--color-danger-surface); color: var(--color-danger); border: 1px solid var(--color-danger-border); }
    .session-timer { font-family: monospace; font-size: 0.85rem; color: var(--color-text); }

    .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: var(--space-section-gap); }

    .critical-path { padding: 0.75rem 1rem; background: var(--color-surface-container); border-radius: var(--radius); font-size: 0.82rem; color: var(--color-text-muted); margin-bottom: 1.25rem; }
    .critical-path .slug { color: var(--color-danger); font-weight: 600; }

    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--color-border); margin-bottom: 1.25rem; }
    .tab-link { padding: 0.55rem 1rem; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.03em;
                color: var(--color-text-dim); border-bottom: 2px solid transparent; }
    .tab-link.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
    .tab-link:hover { text-decoration: none; color: var(--color-text); }

    .task-toolbar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .executor-filter { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .board { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; align-items: flex-start; }
    .board-col { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 0.6rem; }
    .board-col-header { display: flex; justify-content: space-between; align-items: center; padding: 0 0.2rem; }
    .board-col-title { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-dim); }
    .board-col-count { background: var(--color-surface-container-high); color: var(--color-text-dim); font-size: 0.68rem; padding: 0.1em 0.5em; border-radius: 10px; }
    .board-col-empty { border: 1px dashed var(--color-border-strong); border-radius: var(--radius); padding: 1.5rem 0.75rem; text-align: center; color: var(--color-text-dimmer); font-size: 0.8rem; }

    .task-card { cursor: pointer; border-left: 3px solid transparent; }
    .task-card.critical { border-left-color: var(--color-danger); }
    .task-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
    .task-slug { font-size: 0.7rem; color: var(--color-text-dimmer); }
    .wsjf-chip { font-size: 0.65rem; font-weight: 600; padding: 0.1em 0.5em; border-radius: var(--radius-sm); background: var(--color-wsjf-surface); color: var(--color-wsjf); border: 1px solid var(--color-wsjf-border); white-space: nowrap; }
    .task-card-title { font-size: 0.88rem; color: var(--color-text); margin-bottom: 0.6rem; }
    .task-card-footer { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--color-border); }
    .task-card-detail { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--color-border); font-size: 0.78rem; }
    .deps { display: flex; flex-direction: column; gap: 0.35rem; }
    .dep-label { color: var(--color-text-dim); margin-right: 0.5rem; }
    .dep-empty { color: var(--color-text-dimmer); }
    .depchip { display: inline-block; background: var(--color-bg); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
               padding: 0.1em 0.5em; font-family: monospace; font-size: 0.75rem; color: var(--color-text-muted); margin-right: 0.35rem; }

    .roi-table-wrap { margin-top: var(--space-section-gap); }
    h2 { font-size: 1rem; color: var(--color-text-subtle); margin: 0 0 0.75rem; }
  </style>
</head>
<body>
  <div id="app-main">
    <div id="content"><p class="loading">Loading…</p></div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    const id = new URLSearchParams(location.search).get('id');
    const TASK_STATUSES = ['open', 'in-progress', 'blocked', 'done', 'dropped'];
    const BOARD_STATUSES = [
      { key: 'open',        label: 'Open' },
      { key: 'in-progress', label: 'In Progress' },
      { key: 'blocked',     label: 'Blocked' },
      { key: 'done',        label: 'Done' },
    ];
    const EXECUTOR_FILTERS = ['all', 'llm', 'human', 'hybrid', 'auto'];
    let executorFilter = 'all';
    let cachedData = null, cachedCpm = null;

    function setExecutorFilter(f) { executorFilter = f; renderContent(); }

    async function changeTaskStatus(slug, status) {
      try {
        await postJson(`/api/task/${id}/${slug}/status`, { status });
        loadAndRender();
      } catch (e) { alert(`Failed to update status: ${e.message}`); loadAndRender(); }
    }

    function toggleDetail(taskId) {
      const row = document.getElementById(`detail-${taskId}`);
      if (row) row.hidden = !row.hidden;
    }

    let sessionTimerInterval = null;

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return h > 0
        ? `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`
        : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    async function startSessionClick() {
      try { await postJson(`/api/project/${id}/session/start`, {}); loadAndRender(); }
      catch (e) { alert(`Failed to start session: ${e.message}`); loadAndRender(); }
    }

    async function stopSessionClick() {
      try { await postJson(`/api/project/${id}/session/end`, {}); loadAndRender(); }
      catch (e) { alert(`Failed to stop session: ${e.message}`); loadAndRender(); }
    }

    async function loadAndRender() {
      const content = document.getElementById('content');
      if (!id) { content.innerHTML = '<p>No project id in URL.</p>'; return; }
      if (sessionTimerInterval) { clearInterval(sessionTimerInterval); sessionTimerInterval = null; }

      try {
        [cachedData, cachedCpm] = await Promise.all([
          fetchJson(`/api/project/${id}`),
          fetchJson(`/api/cpm/${id}`),
        ]);
      } catch (e) { content.innerHTML = `<p class="error">Error: ${e.message}</p>`; return; }

      renderContent();
    }

    // Rebuilds #content from cachedData/cachedCpm — no refetch, safe to call on every
    // search keystroke / filter change without racing concurrent network requests.
    function renderContent() {
      const content = document.getElementById('content');
      if (!cachedData) return;

      const { project, tasks, status, roi, hours, deps, session } = cachedData;
      const cpm = cachedCpm;

      const slugById = new Map(tasks.map(t => [t.id, t.slug]));
      const predMap = {}, succMap = {};
      for (const t of tasks) { predMap[t.id] = []; succMap[t.id] = []; }
      for (const d of deps) {
        if (succMap[d.predecessor_id]) succMap[d.predecessor_id].push(d.successor_id);
        if (predMap[d.successor_id])   predMap[d.successor_id].push(d.predecessor_id);
      }
      const depChips = (ids) => ids.length
        ? ids.map(tid => `<span class="depchip">${slugById.get(tid) ?? tid}</span>`).join('')
        : '<span class="dep-empty">none</span>';
      document.title = `crux — ${project.name}`;

      const roiScore = hours > 0 ? (roi.revenue / hours).toFixed(0) : '—';

      const stats = [
        { value: tasks.length,           label: 'Total tasks' },
        { value: status.done,            label: 'Done' },
        { value: status.open,            label: 'Open' },
        { value: status.in_progress,     label: 'In Progress' },
        { value: status.blocked,         label: 'Blocked' },
        { value: `${hours.toFixed(1)}h`, label: 'Hours' },
        { value: `$${roiScore}/hr`,      label: 'ROI' },
      ];

      const phases = [...new Set(tasks.map(t => t.phase ?? 'Unphased'))].sort();
      const searchQuery  = (document.getElementById('task-search')?.value ?? '').trim().toLowerCase();
      const phaseFilter  = document.getElementById('phase-filter')?.value ?? 'all';
      const filteredTasks = tasks.filter(t =>
        (executorFilter === 'all' || t.executor === executorFilter) &&
        (phaseFilter === 'all' || (t.phase ?? 'Unphased') === phaseFilter) &&
        (searchQuery === '' || t.slug.toLowerCase().includes(searchQuery) || t.title.toLowerCase().includes(searchQuery))
      );

      const criticalIds = new Set(cpm.nodes.filter(n => n.is_critical).map(n => n.id));
      const wsjfOf = (t) => (t.value_score != null && t.duration_days) ? (t.value_score / t.duration_days).toFixed(1) : null;

      const taskCard = (t) => {
        const wsjf = wsjfOf(t);
        return `
          <div class="card task-card ${criticalIds.has(t.id) ? 'critical' : ''}" onclick="toggleDetail(${t.id})">
            <div class="task-card-top">
              <span class="task-slug"><code>${t.slug}</code></span>
              ${wsjf !== null ? `<span class="wsjf-chip">WSJF ${wsjf}</span>` : ''}
            </div>
            <div class="task-card-title">${t.title}</div>
            <div class="task-card-footer">
              ${executorBadge(t.executor)}
              <select class="status-select" onclick="event.stopPropagation()" onchange="changeTaskStatus('${t.slug}', this.value)">
                ${TASK_STATUSES.map(s => `<option value="${s}" ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
            <div class="task-card-detail" id="detail-${t.id}" hidden onclick="event.stopPropagation()">
              <div class="deps"><div><span class="dep-label">Predecessors:</span>${depChips(predMap[t.id])}</div>
              <div><span class="dep-label">Successors:</span>${depChips(succMap[t.id])}</div></div>
            </div>
          </div>`;
      };

      content.innerHTML = `
        <div class="breadcrumb"><a href="/">Portfolio</a> ${icon('chevron_right', 11)} ${project.name}</div>
        <div class="page-header-row">
          <div class="project-title-row">
            <h1>${project.name}</h1>
            ${statusBadge(project.status)}
          </div>
          <div class="session-widget">
            ${session
              ? `<button class="session-btn stop" onclick="stopSessionClick()">${icon('stop_circle', 15)} Stop session</button><span class="session-timer" id="session-timer"></span>`
              : `<button class="session-btn start" onclick="startSessionClick()">▶ Start session</button>`
            }
          </div>
        </div>
        <div class="meta" style="margin-bottom:1rem">${project.type} · created ${project.created_at.slice(0,10)}</div>
        <div class="stats">
          ${stats.map(s => `<div class="stat"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`).join('')}
        </div>
        ${cpm.critical_path.length > 0 ? `
          <div class="critical-path">${icon('route', 13)} ${cpm.critical_path.map(s => `<span class="slug">★ ${s}</span>`).join(' → ')}</div>
        ` : ''}
        <div class="tabs">
          <span class="tab-link active">Execution</span>
          <a class="tab-link" href="/graph?id=${id}">Dependency Graph</a>
        </div>
        <div class="task-toolbar">
          <input id="task-search" type="text" class="search-input" placeholder="Search tasks by slug or title…" oninput="renderContent()">
          <select id="phase-filter" class="status-select" onchange="renderContent()">
            <option value="all">All phases</option>
            ${phases.map(p => `<option value="${p}" ${p === phaseFilter ? 'selected' : ''}>${p}</option>`).join('')}
          </select>
          <div class="executor-filter">
            ${EXECUTOR_FILTERS.map(f => `
              <button class="filter-btn ${f === executorFilter ? 'active' : ''}" onclick="setExecutorFilter('${f}')">${f === 'all' ? 'All' : f[0].toUpperCase() + f.slice(1)}</button>
            `).join('')}
          </div>
        </div>
        <div class="board">
          ${BOARD_STATUSES.map(col => {
            const colTasks = filteredTasks.filter(t => t.status === col.key);
            return `
              <div class="board-col">
                <div class="board-col-header">
                  <span class="board-col-title">${col.label}</span>
                  <span class="board-col-count">${colTasks.length}</span>
                </div>
                ${colTasks.length
                  ? colTasks.map(taskCard).join('')
                  : `<div class="board-col-empty">No tasks</div>`}
              </div>`;
          }).join('')}
        </div>
        <div class="roi-table-wrap">
          <h2>ROI</h2>
          <table>
            <thead><tr><th>Metric</th><th>Value</th></tr></thead>
            <tbody>
              <tr><td>Hours invested</td><td>${hours.toFixed(1)}h</td></tr>
              <tr><td>Revenue</td><td>$${roi.revenue.toFixed(2)} AUD</td></tr>
              <tr><td>Cost</td><td>$${roi.cost.toFixed(2)} AUD</td></tr>
              <tr><td>Expected (prob-adj)</td><td>$${roi.expected.toFixed(2)} AUD</td></tr>
              <tr><td>ROI/hr</td><td>$${roiScore}/hr</td></tr>
            </tbody>
          </table>
        </div>
      `;

      if (session) {
        const startMs = new Date(session.started_at.replace(' ', 'T') + 'Z').getTime();
        const tick = () => {
          const el = document.getElementById('session-timer');
          if (el) el.textContent = formatElapsed(Date.now() - startMs);
        };
        tick();
        sessionTimerInterval = setInterval(tick, 1000);
      }
    }

    (async () => { renderAgentPanel(); await renderSidebar('project', id); loadAndRender(); })();
  </script>
</body>
</html>
