<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="/manifest.json">
  <title>crux — CPM Graph</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/theme.js"></script>
  <style>
    /* app.js's shared shell makes #app-main a padded, vertically scrolling
       column. The graph wants neither: it fills the pane edge-to-edge and pans
       itself, so the page must never grow its own scrollbar. The extra `body`
       raises specificity — app.js appends its <style> to <head> after this one,
       so an equal-specificity rule would lose. */
    body #app-main { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

    header { padding: 0.9rem 1.2rem 0.4rem; flex-shrink: 0; }
    .breadcrumb { font-size: 0.75rem; color: var(--color-text-dimmer); margin-bottom: 0.3rem; }
    .breadcrumb a { color: var(--color-text-dimmer); }
    h1 { font-size: 1.15rem; color: var(--color-text-bright); }
    #meta { font-size: 0.78rem; color: var(--color-text-dim); margin-top: 0.25rem; line-height: 1.5; }
    #critical-path { font-size: 0.75rem; color: var(--color-danger); margin-top: 0.15rem; word-break: break-all; }

    .legend { display: flex; gap: 1.2rem; padding: 0.5rem 1.2rem; font-size: 0.72rem; color: var(--color-executor-auto); border-bottom: 1px solid var(--color-surface-container); flex-wrap: wrap; flex-shrink: 0; }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .lbox { width: 11px; height: 11px; border-radius: 2px; }

    #graph-wrap {
      flex: 1;
      overflow: hidden;
      cursor: grab;
      position: relative;
      user-select: none;
    }
    #graph-wrap.dragging { cursor: grabbing; }
    #graph-svg { width: 100%; height: 100%; display: block; }

    .zoom-controls { position: absolute; top: 0.6rem; right: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; z-index: 10; }
    .zoom-btn {
      width: 28px; height: 28px;
      background: var(--color-graph-control); color: var(--color-text-muted); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
      font: inherit; font-size: 0.95rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-btn:hover { background: var(--color-graph-control-hover); border-color: var(--color-graph-control-border-hover); color: var(--color-secondary); }

    .error-text { color: var(--color-danger); }

    /* ── Graph SVG ──
       Styled by class rather than by inline fill/stroke attributes so the
       whole diagram re-colours with the theme, and so hover is CSS rather
       than a pair of JS listeners rewriting attributes. */
    .edge      { fill: none; stroke: var(--color-graph-edge); stroke-width: 1.5; }
    .edge.crit { stroke: var(--color-danger); stroke-width: 2; }
    .arrow-head      { fill: var(--color-graph-arrow); }
    .arrow-head.crit { fill: var(--color-danger); }
    /* Status owns the outline. The critical path owns the left accent bar, the
       ★ prefix, the red slug and the edge colour — but NOT the fill and NOT the
       stroke. Both of those used to be red, and on a real project most tasks are
       critical, so a red-tinted fill behind a 2px status stroke drowned the
       status on exactly the nodes you most need to read. Critical is now carried
       entirely by marks at the node's edge, which leaves the whole body free to
       say one thing: what state the work is in. */
    .node-bg                          { fill: var(--color-graph-node-fill); stroke: var(--color-graph-node-stroke); stroke-width: 2; }
    .node.status-todo .node-bg        { stroke: var(--color-status-todo); }
    .node.status-in-progress .node-bg { stroke: var(--color-status-in-progress); }
    .node.status-blocked .node-bg     { stroke: var(--color-status-blocked); }
    .node.status-done .node-bg        { stroke: var(--color-status-done); }
    /* Dropped's grey is the one status close enough to the default border to be
       ambiguous, so it carries a second, non-colour cue (WCAG 1.4.1). */
    .node.status-dropped .node-bg     { stroke: var(--color-status-dropped); stroke-dasharray: 4 3; }

    /* Hover thickens and brightens rather than recolouring: a hover that
       repainted the stroke would erase the status for exactly as long as you
       were pointing at the node you wanted to read. */
    .node:hover .node-bg              { stroke-width: 3.5; }
    .node:hover .node-slug            { fill: var(--color-text-bright); }
    .node-accent          { fill: var(--color-danger); }
    .node-slug            { fill: var(--color-graph-label); font-family: var(--font-mono); }
    .node.crit .node-slug { fill: var(--color-graph-label-crit); }
    .node-title           { fill: var(--color-graph-meta); font-family: var(--font-mono); }
    .node-metrics         { fill: var(--color-graph-wsjf-chip); font-family: var(--font-mono); }
    .node-metrics.no-wsjf { fill: var(--color-graph-wsjf-chip-empty); }
    .node-phase           { fill: var(--color-graph-phase-chip); font-family: var(--font-mono); }
    /* Outlined, not filled — the swatch should depict the encoding it explains,
       which on the graph is a border rather than a body colour. */
    .lbox                    { background: transparent; border: 2px solid var(--color-graph-node-stroke); }
    .lbox.status-todo        { border-color: var(--color-status-todo); }
    .lbox.status-in-progress { border-color: var(--color-status-in-progress); }
    .lbox.status-blocked     { border-color: var(--color-status-blocked); }
    .lbox.status-done        { border-color: var(--color-status-done); }
    .lbox.status-dropped     { border-color: var(--color-status-dropped); border-style: dashed; }
    /* The critical marker is a bar, so its swatch is one too. */
    .lbar         { width: 3px; height: 12px; border-radius: 2px; background: var(--color-danger); }
    .legend-wsjf  { color: var(--color-wsjf); }
    .legend-hint  { color: var(--color-text-faintest); }
  </style>
</head>
<body>
  <div id="app-main">
  <header>
    <div class="breadcrumb"><a href="/">Portfolio</a> › <a id="nav-project" href="#">…</a> › Dependency Graph</div>
    <h1>CPM Graph — <span id="proj-name">…</span></h1>
    <div id="meta">Loading…</div>
    <div id="critical-path"></div>
  </header>
  <div class="legend">
    <span class="legend-item"><div class="lbox status-todo"></div>Todo</span>
    <span class="legend-item"><div class="lbox status-in-progress"></div>In progress</span>
    <span class="legend-item"><div class="lbox status-blocked"></div>Blocked</span>
    <span class="legend-item"><div class="lbox status-done"></div>Done</span>
    <span class="legend-item"><div class="lbox status-dropped"></div>Dropped</span>
    <span class="legend-item"><div class="lbar"></div>★ Critical path (left bar)</span>
    <span class="legend-item legend-wsjf">WSJF = value ÷ duration</span>
    <span class="legend-item">Float = slack before critical</span>
    <span class="legend-item legend-hint">scroll=zoom · drag=pan · click=details</span>
  </div>
  <div id="graph-wrap">
    <svg id="graph-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr"      viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 2 L9 5 L0 8z" class="arrow-head"/></marker>
        <marker id="arr-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 2 L9 5 L0 8z" class="arrow-head crit"/></marker>
      </defs>
      <g id="inner"></g>
    </svg>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="zoom-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button class="zoom-btn" id="zoom-reset" title="Reset view" aria-label="Reset view">⟲</button>
    </div>
  </div>
  </div>

  <script src="/app.js"></script>
  <script>
  // ── Layout: column (longest-path rank) + lane (greedy row assignment) ─────────
  function computeLayout(nodes, edges) {
    if (!nodes.length) return { col: new Map(), lane: new Map(), numCols: 0, numLanes: 0 };

    const preds = new Map(nodes.map(n => [n.id, []]));
    const succs = new Map(nodes.map(n => [n.id, []]));
    const nodeSet = new Set(nodes.map(n => n.id));

    for (const e of edges) {
      if (nodeSet.has(e.predecessor_id) && nodeSet.has(e.successor_id)) {
        preds.get(e.successor_id).push(e.predecessor_id);
        succs.get(e.predecessor_id).push(e.successor_id);
      }
    }

    // Kahn's topological sort
    const inDeg = new Map(nodes.map(n => [n.id, preds.get(n.id).length]));
    const queue = nodes.filter(n => inDeg.get(n.id) === 0).map(n => n.id);
    const order = [];
    while (queue.length) {
      const cur = queue.shift();
      order.push(cur);
      for (const s of succs.get(cur)) {
        const d = inDeg.get(s) - 1;
        inDeg.set(s, d);
        if (d === 0) queue.push(s);
      }
    }

    // Column = max predecessor column + 1
    const col = new Map();
    for (const id of order) {
      const ps = preds.get(id);
      col.set(id, ps.length === 0 ? 0 : Math.max(...ps.map(p => col.get(p))) + 1);
    }

    // Lane = greedy row, prefer first predecessor's lane
    const lane = new Map();
    const colUsed = new Map(); // col → Set<laneNum>

    for (const id of order) {
      const c = col.get(id);
      if (!colUsed.has(c)) colUsed.set(c, new Set());
      const used = colUsed.get(c);

      const pl = preds.get(id).map(p => lane.get(p)).filter(x => x !== undefined);
      // preferred = median of predecessor lanes (or 0)
      const preferred = pl.length === 0 ? 0
        : pl.slice().sort((a, b) => a - b)[Math.floor(pl.length / 2)];

      let assigned = preferred;
      if (used.has(assigned)) {
        let found = false;
        for (let d = 1; d <= nodes.length; d++) {
          if (!used.has(preferred + d)) { assigned = preferred + d; found = true; break; }
          if (preferred - d >= 0 && !used.has(preferred - d)) { assigned = preferred - d; found = true; break; }
        }
        if (!found) assigned = used.size;
      }
      lane.set(id, assigned);
      used.add(assigned);
    }

    return {
      col, lane,
      numCols: Math.max(...col.values()) + 1,
      numLanes: Math.max(...lane.values()) + 1,
    };
  }

  // ── SVG rendering ─────────────────────────────────────────────────────────────
  const COL_W  = 215;
  const ROW_H  = 88;
  const NODE_W = 185;
  const NODE_H = 70;
  const PAD    = 40;

  // `svg` rather than `el`: app.js already owns a global el() for HTML elements,
  // and a second top-level binding of that name is a SyntaxError.
  const NS = 'http://www.w3.org/2000/svg';
  const svg = (tag, a = {}) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    return e;
  };
  const txt = (s, a = {}) => { const e = svg('text', a); e.textContent = s; return e; };
  const trunc = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + '…' : s || '');

  function renderGraph(inner, nodes, edges, cpmData, layout) {
    inner.innerHTML = '';
    const { col, lane } = layout;

    const critSet  = new Set(cpmData.nodes.filter(n => n.is_critical).map(n => n.id));
    const cpmById  = new Map(cpmData.nodes.map(n => [n.id, n]));

    const nx = id => PAD + col.get(id) * COL_W;
    const ny = id => PAD + lane.get(id) * ROW_H;
    const cy = id => ny(id) + NODE_H / 2;

    // ── Edges (rendered behind nodes) ───────────────────────────────────────────
    const edgeG = svg('g');
    inner.appendChild(edgeG);

    for (const e of edges) {
      if (!col.has(e.predecessor_id) || !col.has(e.successor_id)) continue;
      const isCrit = critSet.has(e.predecessor_id) && critSet.has(e.successor_id);

      const x1 = nx(e.predecessor_id) + NODE_W;
      const y1 = cy(e.predecessor_id);
      const x2 = nx(e.successor_id);
      const y2 = cy(e.successor_id);
      const cp = Math.max(30, Math.abs(x2 - x1) * 0.45);

      edgeG.appendChild(svg('path', {
        d: `M${x1} ${y1} C${x1 + cp} ${y1} ${x2 - cp} ${y2} ${x2} ${y2}`,
        class: isCrit ? 'edge crit' : 'edge',
        'marker-end': `url(#${isCrit ? 'arr-crit' : 'arr'})`,
      }));
    }

    // ── Nodes ───────────────────────────────────────────────────────────────────
    const nodeG = svg('g');
    inner.appendChild(nodeG);

    for (const n of nodes) {
      const isCrit = critSet.has(n.id);
      const cpm    = cpmById.get(n.id);
      const x = nx(n.id);
      const y = ny(n.id);

      // `status-*` drives the outline colour from CSS. n.status rides in on the
      // task rows already fetched for the layout, so this costs no extra request.
      const g = svg('g', { class: `node${isCrit ? ' crit' : ''} status-${n.status}`, 'data-id': n.id });
      g.style.cursor = 'pointer';

      // Background
      g.appendChild(svg('rect', {
        x, y, width: NODE_W, height: NODE_H, rx: 4, ry: 4, class: 'node-bg',
      }));

      // Left accent bar for critical
      if (isCrit) {
        g.appendChild(svg('rect', { x, y, width: 5, height: NODE_H, rx: 2, ry: 2, class: 'node-accent' }));
      }

      // Slug
      g.appendChild(txt((isCrit ? '★ ' : '○ ') + trunc(n.slug, 22), {
        x: x + 12, y: y + 21,
        class: 'node-slug',
        'font-size': 12,
        'font-weight': 'bold',
      }));

      // Title
      g.appendChild(txt(trunc(n.title, 27), {
        x: x + 12, y: y + 36,
        class: 'node-title',
        'font-size': 10,
      }));

      // Metrics row
      if (cpm) {
        const parts = [];
        if (cpm.duration    != null) parts.push(`${cpm.duration}d`);
        if (cpm.float_days  != null && !isCrit) parts.push(`float:${cpm.float_days}`);
        if (cpm.wsjf_score  != null) parts.push(`WSJF ${cpm.wsjf_score}`);
        if (parts.length) {
          g.appendChild(txt(parts.join('  ·  '), {
            x: x + 12, y: y + 53,
            class: cpm.wsjf_score != null ? 'node-metrics' : 'node-metrics no-wsjf',
            'font-size': 9.5,
              }));
        }
      }

      // Phase (bottom-right)
      if (n.phase) {
        g.appendChild(txt(trunc(n.phase, 12), {
          x: x + NODE_W - 8, y: y + NODE_H - 7,
          class: 'node-phase',
          'font-size': 8,
            'text-anchor': 'end',
        }));
      }

      // Hover highlight lives in CSS (.node:hover .node-bg) so it follows the theme.

      nodeG.appendChild(g);
    }
  }

  // ── Pan / zoom ────────────────────────────────────────────────────────────────
  const ZOOM_MIN = 0.08, ZOOM_MAX = 4;

  function setupPanZoom(svgEl, innerEl, contentW, contentH) {
    let tx = 0, ty = 0, sc = 1;
    let dragging = false, ox = 0, oy = 0;
    const wrap = svgEl.parentElement;

    const apply = () => innerEl.setAttribute('transform', `translate(${tx},${ty}) scale(${sc})`);

    // Initial fit
    const fit = () => {
      const vw = svgEl.clientWidth  || wrap.clientWidth  || 900;
      const vh = svgEl.clientHeight || wrap.clientHeight || 500;
      sc = Math.min(1, (vw - 60) / contentW, (vh - 40) / contentH);
      tx = (vw - contentW * sc) / 2;
      ty = 20;
      apply();
    };
    requestAnimationFrame(fit);
    window.addEventListener('resize', fit);

    // Zoom toward a given point in svg-client coordinates (defaults to viewport center,
    // which is what the +/- toolbar buttons use; wheel zoom passes the cursor position).
    const zoomBy = (factor, cx, cy) => {
      const vw = svgEl.clientWidth  || wrap.clientWidth  || 900;
      const vh = svgEl.clientHeight || wrap.clientHeight || 500;
      const mx = cx ?? vw / 2;
      const my = cy ?? vh / 2;
      const newSc = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, sc * factor));
      tx = mx - (mx - tx) * (newSc / sc);
      ty = my - (my - ty) * (newSc / sc);
      sc = newSc;
      apply();
    };

    svgEl.addEventListener('mousedown', e => {
      dragging = true; ox = e.clientX - tx; oy = e.clientY - ty;
      wrap.classList.add('dragging');
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      tx = e.clientX - ox; ty = e.clientY - oy; apply();
    });
    window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('dragging'); });

    svgEl.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = svgEl.getBoundingClientRect();
      zoomBy(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    return {
      zoomIn:  () => zoomBy(1.25),
      zoomOut: () => zoomBy(0.8),
      reset:   fit,
    };
  }

  // ── Main ──────────────────────────────────────────────────────────────────────
  async function main() {
    const projId   = new URLSearchParams(location.search).get('id');
    const metaEl   = document.getElementById('meta');
    const cpEl     = document.getElementById('critical-path');
    const svgEl    = document.getElementById('graph-svg');
    const innerEl  = document.getElementById('inner');

    if (!projId) { metaEl.textContent = 'No project id in URL (?id=…)'; return; }

    renderAgentPanel();
    renderTaskPanel();
    await renderSidebar('graph', projId);

    const navProject = document.getElementById('nav-project');
    navProject.href = `/project?id=${projId}`;

    let projData, cpm, allDeps;
    try {
      [projData, cpm, allDeps] = await Promise.all([
        fetchJson(`/api/project/${projId}`),
        fetchJson(`/api/cpm/${projId}`),
        fetchJson(`/api/db/dependencies`),
      ]);
    } catch (err) {
      metaEl.innerHTML = `<span class="error-text">Error: ${err.message}</span>`;
      return;
    }

    const { project, tasks } = projData;
    document.title = `crux — ${project.name} graph`;
    document.getElementById('proj-name').textContent = project.name;
    navProject.textContent = project.name;

    if (!tasks.length) {
      metaEl.textContent = 'No tasks in this project.';
      return;
    }

    const showSummary = () => {
      metaEl.innerHTML =
        `<strong>${tasks.length}</strong> tasks &nbsp;|&nbsp; ` +
        `project duration: <strong>${cpm.project_duration ?? '?'}</strong> days &nbsp;|&nbsp; ` +
        `${cpm.nodes.filter(n => n.is_critical).length} critical tasks`;
      cpEl.textContent = cpm.critical_path?.length ? '★ ' + cpm.critical_path.join(' → ') : '';
    };
    showSummary();

    const taskIds = new Set(tasks.map(t => t.id));
    const edges   = allDeps.filter(d =>
      taskIds.has(d.predecessor_id) && taskIds.has(d.successor_id)
    );

    const layout   = computeLayout(tasks, edges);
    const contentW = PAD * 2 + layout.numCols  * COL_W;
    const contentH = PAD * 2 + layout.numLanes * ROW_H;

    renderGraph(innerEl, tasks, edges, cpm, layout);
    const panZoom = setupPanZoom(svgEl, innerEl, contentW, contentH);
    document.getElementById('zoom-in').addEventListener('click', panZoom.zoomIn);
    document.getElementById('zoom-out').addEventListener('click', panZoom.zoomOut);
    document.getElementById('zoom-reset').addEventListener('click', panZoom.reset);

    // Node click → editable detail panel
    let cpmById = new Map(cpm.nodes.map(n => [n.id, n]));
    const slugById = new Map(tasks.map(t => [t.id, t.slug]));
    const neighboursOf = (id) => ({
      predecessors: edges.filter(d => d.successor_id === id).map(d => slugById.get(d.predecessor_id)).filter(Boolean),
      successors:   edges.filter(d => d.predecessor_id === id).map(d => slugById.get(d.successor_id)).filter(Boolean),
    });

    svgEl.addEventListener('click', e => {
      const g = e.target.closest('.node');
      if (!g) return;
      const nid  = parseInt(g.dataset.id, 10);
      const task = tasks.find(t => t.id === nid);
      if (!task) return;

      const opened = openTaskPanel(projId, task, cpmById.get(nid), {
        neighbours: neighboursOf(nid),
        // Repaint in place rather than reloading: a reload would throw away the
        // pan and zoom the user set up to find this node in the first place.
        //
        // The CPM is refetched rather than reused, because editing a duration
        // moves float and can move the critical path itself. The layout is not
        // recomputed — it depends only on the dependency DAG, so nodes stay
        // exactly where the user left them.
        onSaved: async (updated) => {
          Object.assign(task, updated);
          try { cpm = await fetchJson(`/api/cpm/${projId}`); } catch { /* keep the last good schedule */ }
          cpmById = new Map(cpm.nodes.map(n => [n.id, n]));
          showSummary();
          renderGraph(innerEl, tasks, edges, cpm, layout);
          document.querySelector(`.node[data-id="${nid}"]`)?.classList.add('tp-selected');
          return cpmById.get(nid);
        },
      });

      // Only after the panel agreed to switch — otherwise cancelling the
      // discard prompt would leave the highlight on a node you are not editing.
      if (opened) {
        document.querySelectorAll('.node.tp-selected').forEach(n => n.classList.remove('tp-selected'));
        g.classList.add('tp-selected');
      }
    });
  }

  main();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
